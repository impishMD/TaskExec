# Adapted from semaphoreui/charts (Apache-2.0); see NOTICE.
# Single-server deployment. TaskExec does not support multiple server replicas.
replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/impishmd/taskexec
  # Empty selects v<Chart.appVersion>. A digest takes precedence over the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Bootstrap credentials and encryption key in an existing Kubernetes Secret.
secrets:
  existingSecret: ""
  accesskeyEncryptionKey: TASKEXEC_ACCESS_KEY_ENCRYPTION
admin:
  username: admin
  fullname: Administrator
  email: admin@localhost
  # Empty uses secrets.existingSecret.
  existingSecret: ""
  passwordKey: TASKEXEC_ADMIN_PASSWORD
general:
  # Public URL, including a subpath when used.
  host: ""
  passwordLoginDisable: false
  nonAdminCanCreateProject: false
config:
  forwarded_env_vars: []
database:
  type: sqlite
  host: ""
  port: 0
  name: taskexec
  options: {}
  # Empty uses secrets.existingSecret. Required for postgres/mysql.
  existingSecret: ""
  usernameKey: TASKEXEC_DB_USER
  passwordKey: TASKEXEC_DB_PASS

# Provider settings use the same camelCase form as the Semaphore UI chart.
oidc:
  enable: false
  providers: {}
  # keycloak:
  #   displayName: Keycloak
  #   providerUrl: https://sso.example.com/realms/main
  #   clientId: taskexec
  #   existingSecret: taskexec-oidc
  #   clientSecretKey: client-secret
  #   scopes: [openid, profile, email]
  #   usernameClaim: preferred_username
  #   nameClaim: name
  #   emailClaim: email

serviceAccount:
  create: true
  name: ""
  annotations: {}
labels: {}
annotations: {}
dnsConfig: {}
extraInitContainers: []
extraSidecarContainers: []
customCertificates:
  enabled: false
  existingSecret: ""
  existingConfigMap: ""
  key: ca.crt

service:
  type: ClusterIP
  port: 3000
  annotations: {}
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tasks.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  # Holds both config/config.json and database.sqlite (for SQLite).
  existingClaim: ""
  size: 10Gi
  # null: cluster default; "": no storage class; otherwise: class name.
  storageClass: null
  accessModes: [ReadWriteOnce]
  retain: true
  annotations: {}
volumePermissions:
  # Only needed for volumes/imports that do not respect fsGroup ownership.
  enabled: false

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  # Local tasks and tool installation need writable locations in the image.
  readOnlyRootFilesystem: false
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
startupProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 6
terminationGracePeriodSeconds: 60
nodeSelector: {}
tolerations: []
affinity: {}
# Additional non-secret environment variables. Built-in chart settings cannot be overridden.
extraEnvVariables: {}
# Additional Secrets/ConfigMaps. Prefer secrets.existingSecret for bootstrap credentials.
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
# Environment values from individual Kubernetes Secret keys.
extraEnvSecrets: {}
# TOKEN:
#   secret: application-tokens
#   key: token
envFromSecrets: []
envFromConfigMaps: []
