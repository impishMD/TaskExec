apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskexec.fullname" . }}
  labels:
    {{- include "taskexec.labels" . | nindent 4 }}
data:
  {{- include "taskexec.environment" . | nindent 2 }}
  {{- range $key, $value := .Values.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
