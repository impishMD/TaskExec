{{/* Adapted for TaskExec from Semaphore UI Charts; see NOTICE and LICENSE. */}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskexec.fullname" . }}-test
  labels:
    app.kubernetes.io/name: {{ include "taskexec.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.image.pullSecrets }}
  imagePullSecrets:
    {{- range . }}
    - name: {{ . | quote }}
    {{- end }}
  {{- end }}
  containers:
    - name: ping
      image: {{ include "taskexec.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: ["curl"]
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - {{ printf "http://%s:%v%s/api/ping" (include "taskexec.fullname" .) .Values.service.port (include "taskexec.basePath" .) | quote }}
