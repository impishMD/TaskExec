name: taskexec
services:
  taskexec:
    image: ${TASKEXEC_IMAGE:-impishmd/taskexec}:${TASKEXEC_VERSION:-latest}
    restart: unless-stopped
    ports: ["${TASKEXEC_BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    environment:
      TASKEXEC_DB_DIALECT: sqlite
      TASKEXEC_ADMIN: ${TASKEXEC_ADMIN:-admin}
      TASKEXEC_ADMIN_NAME: ${TASKEXEC_ADMIN_NAME:-Administrator}
      TASKEXEC_ADMIN_EMAIL: ${TASKEXEC_ADMIN_EMAIL:-admin@localhost}
      TASKEXEC_ADMIN_PASSWORD: ${TASKEXEC_ADMIN_PASSWORD:?Set TASKEXEC_ADMIN_PASSWORD in .env}
      TASKEXEC_ACCESS_KEY_ENCRYPTION: ${TASKEXEC_ACCESS_KEY_ENCRYPTION:?Set a base64 32-byte encryption key in .env}
    volumes:
      - taskexec-config:/etc/taskexec
      - taskexec-data:/var/lib/taskexec
volumes:
  taskexec-config:
  taskexec-data:
