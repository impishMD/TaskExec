version: "3.4"

volumes:
  postgres:

services:
  server:
    environment:
      JEH_DB_DIALECT: postgres
      JEH_DB_HOST: db
      JEH_DB_PORT: 5432
      JEH_DB_USER: ${POSTGRES_USERNAME:-jeh}
      JEH_DB_PASS: ${POSTGRES_PASSWORD:-jeh}
      JEH_DB: ${POSTGRES_DATABASE:-jeh}
    depends_on:
      - db

  db:
    image: postgres:14.3
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-jeh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jeh}
      POSTGRES_DB: ${POSTGRES_DATABASE:-jeh}
    volumes:
      - postgres:/var/lib/postgresql
