version: "3.4"

volumes:
  mysql:

services:
  server:
    environment:
      TASKEXEC_DB_DIALECT: mysql
      TASKEXEC_DB_HOST: db
      TASKEXEC_DB_PORT: 3306
      TASKEXEC_DB_USER: ${MYSQL_USERNAME:-taskexec}
      TASKEXEC_DB_PASS: ${MYSQL_PASSWORD:-taskexec}
      TASKEXEC_DB: ${MYSQL_DATABASE:-taskexec}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT:-root}
      MYSQL_USER: ${MYSQL_USERNAME:-taskexec}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskexec}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskexec}
    volumes:
      - mysql:/var/lib/mysql
