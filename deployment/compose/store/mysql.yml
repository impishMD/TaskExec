version: "3.4"

volumes:
  mysql:

services:
  server:
    environment:
      JEH_DB_DIALECT: mysql
      JEH_DB_HOST: db
      JEH_DB_PORT: 3306
      JEH_DB_USER: ${MYSQL_USERNAME:-jeh}
      JEH_DB_PASS: ${MYSQL_PASSWORD:-jeh}
      JEH_DB: ${MYSQL_DATABASE:-jeh}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT:-root}
      MYSQL_USER: ${MYSQL_USERNAME:-jeh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jeh}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jeh}
    volumes:
      - mysql:/var/lib/mysql
