version: '3.8'

services:
  ldap:
    image: osixia/openldap:1.4.0
#    container_name: openldap
    environment:
      LDAP_ORGANISATION: "Example Inc."
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "admin"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d

  ldap_admin:
    image: osixia/phpldapadmin:0.9.0
#    container_name: phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
    ports:
      - "6443:443"
    depends_on:
      - ldap

  jeh:
    image: impishmd/jeh:latest
#    container_name: jeh
    environment:
      JEH_DB_DIALECT: "sqlite"
      JEH_ADMIN_PASSWORD: "changeme"
      JEH_ADMIN_NAME: "admin"
      JEH_ADMIN_EMAIL: "admin@example.org"
      JEH_LDAP_ACTIVATED: "yes"
      JEH_LDAP_SERVER: "ldap:389"
      JEH_LDAP_SEARCH_DN: "dc=example,dc=org"
      JEH_LDAP_BIND_DN: "cn=admin,dc=example,dc=org"
      JEH_LDAP_BIND_PASSWORD: "admin"
      JEH_LDAP_SEARCH_FILTER: "(&(objectClass=inetOrgPerson)(uid=%s))"
      JEH_NON_ADMIN_CAN_CREATE_PROJECT: "yes"
    ports:
      - "3000:3000"
    volumes:
      - jeh_data:/var/lib/jeh
    depends_on:
      - ldap

volumes:
  ldap_data:
  ldap_config:
  jeh_data: