version: 2
project_name: taskexec
before:
  hooks:
    - make frontend
builds:
  - id: taskexec
    binary: taskexec
    main: ./cli
    env: [CGO_ENABLED=0]
    tags: [netgo]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/impishMD/taskexec/util.Ver=v{{ .Version }} -X github.com/impishMD/taskexec/util.Commit={{ .ShortCommit }} -X github.com/impishMD/taskexec/util.Date={{ .Date }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    name_template: 'taskexec_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-LICENSES.md
      - README.md
      - docs/**/*
      - charts/taskexec/**/*
      - deployment/systemd/*
      - compose.yaml
      - .env.example
source:
  enabled: true
  name_template: 'taskexec_{{ .Version }}_source'
checksum:
  name_template: checksums.txt
snapshot:
  version_template: '{{ if .Env.TASKEXEC_SNAPSHOT_VERSION }}{{ .Env.TASKEXEC_SNAPSHOT_VERSION }}{{ else }}{{ .Version }}-dev{{ end }}'
nfpms:
  - id: taskexec
    package_name: taskexec
    file_name_template: 'taskexec_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    homepage: https://github.com/impishMD/TaskExec
    maintainer: impishMD <impishmd@users.noreply.github.com>
    description: TaskExec — automation for Ansible, Terraform, OpenTofu and scripts.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    dependencies: [git, openssh-client]
    overrides:
      rpm:
        dependencies: [git, openssh-clients, shadow-utils]
      deb:
        dependencies: [git, openssh-client, passwd]
    contents:
      - src: deployment/systemd/taskexec.service
        dst: /usr/lib/systemd/system/taskexec.service
      - src: LICENSE
        dst: /usr/share/licenses/taskexec/LICENSE
      - src: NOTICE
        dst: /usr/share/licenses/taskexec/NOTICE
      - src: THIRD-PARTY-LICENSES.md
        dst: /usr/share/licenses/taskexec/THIRD-PARTY-LICENSES.md
    scripts:
      preinstall: deployment/packaging/preinstall.sh
      postinstall: deployment/packaging/postinstall.sh
release:
  draft: true
  name_template: '{{ .Tag }}'
changelog:
  disable: true
